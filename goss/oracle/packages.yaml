---
package:
  chrony:
    installed: true

  cri-tools:
    installed: true

  containerd.io:
    installed: false

  kubeadm:
    installed: true

  kubectl:
    installed: true

  kubelet:
    installed: true

command:
  verify-uek7-kernel-when-enabled:
    exec: >-
      bash -c 'running_kernel="$(uname -r)";
      [[ "${running_kernel}" != *uek* ]] && exit 0;
      [[ "${running_kernel}" = 5.15.*uek* ]] || exit 1;
      running_version="$(sed -E "s/\.el[89]uek.*$//" <<< "${running_kernel}")";
      test "$(printf "%s\n" "5.15.0-322.203.3.4.5" "${running_version}" | sort -V | head -n 1)"
      = "5.15.0-322.203.3.4.5"'
    exit-status: 0
